name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK Platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then ./gradlew --no-daemon assembleDebug; else
            curl -sLo gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            unzip -q gradle.zip
            ./gradle-8.9/bin/gradle --no-daemon assembleDebug
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: reel-counter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
